---
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run at 1:00 every day
    - cron: 0 1 * * *
  workflow_dispatch: {}

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        python-version: ['3.13']
        platform: [ubuntu-latest, windows-latest]
        hook-stage: [pre-commit, pre-push, manual]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      # We have a race condition.
      # In particular, we push doccmd to PyPI and then not long after we try to install
      # the pushed version.
      # Here, we give PyPI time to propagate the package.
      - name: Install doccmd from PyPI
        uses: nick-fields/retry@v4
        with:
          timeout_seconds: 20
          max_attempts: 20
          command: uv sync --refresh
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Lint
        uses: j178/prek-action@v3.0.0
        with:
          prek-version: 0.4.11
          extra-args: >-
            --all-files --hook-stage ${{ matrix.hook-stage }} --verbose
        env:
          UV_NO_CACHE: '1'
          UV_PYTHON: ${{ matrix.python-version }}

  completion-lint:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix job status
        run: |-
          if ! ${{ needs.build.result == 'success' }}; then
            echo "One or more matrix jobs failed"
            exit 1
          fi
